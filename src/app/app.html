<div class="min-h-screen">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
      <a routerLink="/" class="flex items-center gap-2 text-lg font-semibold text-slate-900">
        <span>🛍️</span>
        <span>Aurora Goods</span>
      </a>
      <a routerLink="/cart" class="relative flex items-center gap-1 text-sm font-medium text-slate-600 hover:text-brand-600">
        🛒 Cart
        @if (cartService.itemCount(); as count) {
          @if (count > 0) {
            <span class="absolute -right-3 -top-2 flex h-5 min-w-5 items-center justify-center rounded-full bg-brand-600 px-1 text-xs text-white">
              {{ count }}
            </span>
          }
        }
      </a>
    </div>
  </header>

  <main>
    <router-outlet />
  </main>

  <app-agent-console />
</div>
